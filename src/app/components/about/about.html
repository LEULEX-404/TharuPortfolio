<section id="about" class="experience-section">
  <div class="container">
    <div class="section-head">
      <div class="head-text">
        <span class="eyebrow">// experience</span>
        <h2>Work <span class="outline">experience</span></h2>
      </div>
      <div class="head-side">
        <span class="section-deco" aria-hidden="true"><span class="deco-dot"></span></span>
        <p>From client-facing insurance work to top-of-class software engineering.</p>
      </div>
    </div>

    <div class="exp-list">
      <div class="exp-item" *ngFor="let item of timeline">
        <div class="exp-year">{{ item.year }}</div>
        <div class="exp-body">
          <h3>{{ item.title }}</h3>
          <div class="company">{{ item.company }}</div>
          <p>{{ item.description }}</p>
        </div>
        <div class="exp-type" [class]="item.type">{{ item.type }}</div>
      </div>
    </div>
  </div>
</section>
