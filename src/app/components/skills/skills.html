<section id="skills" class="skills-section">
  <div class="container">
    <div class="section-head">
      <div class="head-text">
        <span class="eyebrow">// skills &amp; stack</span>
        <h2>Skills &amp; <span class="outline">stack</span></h2>
      </div>
      <div class="head-side">
        <span class="section-deco" aria-hidden="true"><span class="deco-dot"></span></span>
        <p>Frontend to deployment — the tools I reach for on every build.</p>
      </div>
    </div>

    <div class="skills-grid">
      <div class="skill-col" *ngFor="let column of skillColumns">
        <h4>{{ column.name }}</h4>
        <div class="skill-row" *ngFor="let skill of column.skills">
          <div class="skill-info">
            <span class="skill-logo">
              <img *ngIf="skill.logo" [src]="logoUrl(skill.logo)" [alt]="skill.name" loading="lazy">
              <svg *ngIf="!skill.logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 5 3 12l5 7M16 5l5 7-5 7M13 4l-2 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="skill-name">{{ skill.name }}</span>
          </div>
          <div class="bar"><i [style.width.%]="skill.level"></i></div>
        </div>
      </div>
    </div>

    <div class="cert-row">
      <div class="cert-item" *ngFor="let cert of certifications">
        <b>{{ cert.title }}</b>{{ cert.issuer }} — {{ cert.date }}
      </div>
    </div>

    <div class="resume-cta">
      <button class="btn btn-outline" (click)="downloadResume()">Download full resume ↓</button>
    </div>
  </div>
</section>
