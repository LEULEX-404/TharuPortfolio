<footer class="contact" id="contact">
  <div class="container">
    <div class="contact-inner">
      <span class="eyebrow center-eyebrow">// contact</span>

      <h2 class="contact-heading">
        Let's craft<br>
        <span class="accent">the next</span><br>
        chapter.
      </h2>

      <a class="contact-email" [href]="'mailto:' + email">{{ email }}</a>

      <div class="contact-links">
        <a href="https://www.linkedin.com/in/miyuru-tharuka-18a9b6412" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/LEULEX-404" target="_blank" rel="noopener">GitHub</a>
        <a href="javascript:void(0)" (click)="downloadCV()">Download CV</a>
      </div>
    </div>

    <div class="watermark" aria-hidden="true">SANJEEWA</div>

    <div class="foot-bottom">
      <span class="foot-copy">© {{ currentYear }} Tharuka Sanjeewa. All rights reserved.</span>

      <div class="foot-socials">
        <a *ngFor="let social of socialLinks" [href]="social.url" target="_blank" rel="noopener" [attr.aria-label]="social.name" [title]="social.name">

          </svg>
          <svg *ngIf="social.icon === 'linkedin'" viewBox="0 0 24 24" fill="none" aria-hidden="true">

          </svg>
          <svg *ngIf="social.icon === 'facebook'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M13.5 21v-7.2h2.4l.46-2.86h-2.86V9.1c0-.83.23-1.4 1.42-1.4h1.52V5.14C15.86 5.05 14.94 5 13.87 5c-2.68 0-4.51 1.64-4.51 4.63v2.31H6.94v2.86h2.42V21h4.14Z" fill="currentColor"/>

          <svg *ngIf="social.icon === 'whatsapp'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M17.47 14.38c-.28-.14-1.66-.82-1.92-.91-.26-.1-.44-.14-.63.14-.19.28-.72.91-.88 1.09-.16.19-.32.21-.6.07-.28-.14-1.17-.43-2.23-1.38-.83-.74-1.38-1.65-1.55-1.93-.16-.28-.02-.43.13-.57.14-.14.32-.36.47-.54.16-.19.21-.32.32-.53.1-.21.05-.4-.03-.54-.09-.14-.62-1.49-.85-2.04-.22-.53-.45-.46-.63-.47h-.53c-.19 0-.5.07-.76.35-.26.28-1 .98-1 2.38s1.03 2.76 1.17 2.95c.14.19 1.98 3.03 4.8 4.13 2.82 1.11 2.82.74 3.32.69.5-.05 1.66-.68 1.9-1.34.23-.66.23-1.22.16-1.34-.07-.12-.26-.19-.53-.33Z" fill="currentColor"/>
            <path d="M12.02 2.5A9.5 9.5 0 0 0 3.9 16.62L2.5 21.5l5.05-1.33A9.5 9.5 0 1 0 12.02 2.5Zm0 17.24a7.66 7.66 0 0 1-3.9-1.07l-.28-.16-2.98.79.8-2.9-.18-.3a7.72 7.72 0 1 1 6.54 3.64Z" fill="currentColor"/>
          </svg>
          <svg *ngIf="social.icon === 'email'" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 6.5 12 13l8-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <span class="status-pill"><span class="dot"></span>Open to work</span>
    </div>
  </div>
</footer>
