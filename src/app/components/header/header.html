<header class="site-nav" [class.scrolled]="isScrolled">
  <div class="nav-inner">
    <a class="logo" href="#home" (click)="scrollToSection('home', $event)">
      <span class="logo-mark"><span class="dot"></span></span>
      <span class="logo-text">Miyuru Tharuka<span class="cursor">_</span></span>
    </a>

    <nav class="nav-links" [class.open]="isMobileMenuOpen">
      <a
        *ngFor="let item of menuItems"
        [href]="'#' + item.section"
        [class.active]="activeSection === item.section"
        (click)="scrollToSection(item.section, $event)">
        {{ item.label }}
      </a>

      <div class="nav-actions">
        <span class="nav-status"><span class="pulse-dot"></span>Open to work</span>
        <a class="nav-cta" href="mailto:miyurut20@gmail.com">
          <span>Let's talk</span>
          <span class="cta-arrow">→</span>
        </a>
      </div>
    </nav>

    <button class="nav-toggle" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()" aria-label="Toggle menu">
      <span class="bar bar1"></span>
      <span class="bar bar2"></span>
      <span class="bar bar3"></span>
    </button>
  </div>

  <span class="scroll-progress" [style.width.%]="scrollProgress"></span>

  <div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()"></div>
</header>
